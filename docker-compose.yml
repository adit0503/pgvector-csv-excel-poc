services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector_db
    restart: always
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: pgvector_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: vectordb
      DB_USER: postgres
      DB_PASSWORD: password123
      PYTHONPATH: /app/src
    volumes:
      - .:/app
    stdin_open: true
    tty: true
    command: python -m pgvector_poc.demo

volumes:
  pgdata:
