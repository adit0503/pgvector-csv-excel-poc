[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pgvector-poc"
version = "0.1.0"
description = "PostgreSQL + pgvector Proof of Concept for CSV and Excel semantic indexing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.2",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "sentence-transformers>=3.0.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
]

[project.scripts]
pgvector-demo = "pgvector_poc.demo:main"
pgvector-query = "pgvector_poc.query:interactive_cli"
pgvector-ingest = "pgvector_poc.ingest:run_pipeline"
pgvector-generate = "pgvector_poc.generate_data:main"

[tool.setuptools.packages.find]
where = ["src"]
